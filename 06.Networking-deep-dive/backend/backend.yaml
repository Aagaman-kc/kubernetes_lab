apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: dev
  labels:
    app: backend

spec:
  replicas: 3

  selector:
    matchLabels:
      app: backend

  template:

    metadata:
      labels:
        app: backend

    spec:
      containers:

      - name: backend

        image: fastapi-backend:1.0

        imagePullPolicy: Never

        ports:
        - containerPort: 80

---

apiVersion: v1
kind: Service

metadata:
  name: backend
  namespace: dev

spec:

  selector:
    app: backend

  ports:
  - port: 80
    targetPort: 80

  type: ClusterIP