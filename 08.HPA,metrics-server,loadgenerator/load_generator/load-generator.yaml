apiVersion: apps/v1
kind: Deployment

metadata:
  name: load-generator
  namespace: dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: load-generator

  template:
    metadata:
      labels:
        app: load-generator

    spec:
      containers:
      - name: load-generator
        image: load-generator:1.1