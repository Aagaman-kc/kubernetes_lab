apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: dev
  labels:
    app: backend

spec:
  replicas: 3

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend
        image: backend:1.0

        ports:
        - containerPort: 80

        resources:
          requests:
            cpu: "100m" # this pod need 0.1 cpu core
            memory: "128Mi"

          limits:
            cpu: "500m" # at max it need 0.5 cpu core
            memory: "256Mi"

---

apiVersion: v1
kind: Service

metadata:
  name: backend
  namespace: dev

spec:
  selector:
    app: backend

  ports:
  - port: 80
    targetPort: 80

  type: ClusterIP