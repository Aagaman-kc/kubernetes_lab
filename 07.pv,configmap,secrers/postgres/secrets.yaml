# =============================================
# Secret — stores sensitive data (base64 encoded)
# =============================================
# Unlike ConfigMap, Secret values are base64-encoded.
# But base64 is NOT encryption — anyone can decode it.
# Never commit real secrets to Git in production.
# For local/learning clusters, plain values here are acceptable.
apiVersion: v1
kind: Secret

metadata:
  name: postgresql-secret  # referenced by StatefulSet via secretKeyRef
  namespace: dev

# Opaque = arbitrary key-value pairs (most common secret type)
type: Opaque

# stringData accepts plain-text values;
# Kubernetes automatically base64-encodes them when storing.
stringData:
  POSTGRES_USER: admin          # injected as env var into Postgres container
  POSTGRES_PASSWORD: password123
  
