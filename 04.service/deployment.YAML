apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-api-deployment
  namespace: dev 
  labels:
    app: node-api 
spec:
  replicas: 3
  selector:
    matchLabels:
      app: node-api
  template:
    metadata:
      labels:
        app: node-api
        tier: backend
    spec:
      containers:
        - name: node-api-deployment
          image: nginx
          ports:
            - containerPort: 80