apiVersion: v1
kind: Service
metadata:
  name: node-service
  namespace: dev
spec:
  selector:
    app: node-api     # Must match the pods' labels
  ports:
    - protocol: TCP
      port: 80         # Port the Service listens on inside the cluster
      targetPort: 80   # Port the container is listening on (your app's port)
  type: ClusterIP      # Default - only accessible inside the cluster
# Other types: NodePort, LoadBalancer (AWS), ExternalName